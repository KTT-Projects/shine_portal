name: shine_portal
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.2
  firebase_auth: 4.17.6
  google_fonts: 6.2.0
  firebase_core: 2.25.5
  loading_animation_widget: 1.2.0+4
  google_nav_bar: 5.0.6
  animations: 2.0.11
  flutter_chat_ui: 1.6.12
  searchfield: 0.9.7
  cloud_firestore: 4.15.6
  flutter_slidable: 3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - lib/images/

flutter_launcher_icons:
  ios: true
  image_path: "lib/images/app_logo.jpg"
  remove_alpha_ios: true
  android: true
