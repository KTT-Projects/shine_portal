name: shine_portal
description: "社員用ポータルサイト"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_auth: ^4.19.3
  google_fonts: ^6.2.1
  firebase_core: ^2.30.1
  loading_animation_widget: ^1.2.1
  google_nav_bar: 5.0.6
  animations: 2.0.11
  flutter_chat_ui: 1.6.12
  searchfield: ^1.0.1
  cloud_firestore: ^4.17.1
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - lib/images/

flutter_launcher_icons:
  ios: true
  image_path: "lib/images/app_logo.jpg"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "lib/images/app_logo_transparent.png"
